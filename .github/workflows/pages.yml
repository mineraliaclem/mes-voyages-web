name: Publier la version web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter la bibliothèque Firebase
        run: |
          mkdir -p vendor
          cd "$RUNNER_TEMP"
          npm pack firebase@10.14.1 --silent
          tar xzf firebase-10.14.1.tgz
          for f in app auth firestore; do cp "package/firebase-$f-compat.js" "$GITHUB_WORKSPACE/vendor/"; done

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html collab-firebase.js app-extras.js city-places.js fonts.css fonts sw.js firebase-config.js manifest.webmanifest icons vendor _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
